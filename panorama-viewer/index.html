<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>全景照片查看器</title>
  </head>
  <body>
    <div class="panorama-shell" id="app">
      <div class="panorama-stage" id="viewer"></div>

      <div class="panorama-overlay panorama-overlay--status" id="status">
        <div class="panorama-card">
          <div class="panorama-card__title" id="status-title">
            全景照片查看器
          </div>
          <div class="panorama-card__body" id="status-text">初始化中...</div>
        </div>
      </div>

      <div class="panorama-overlay panorama-overlay--status hidden" id="error">
        <div class="panorama-card panorama-card--error">
          <div class="panorama-card__title" id="error-title">
            无法显示全景照片
          </div>
          <div class="panorama-card__body" id="error-text"></div>
          <div class="panorama-card__actions">
            <button
              class="panorama-card__action"
              id="error-home-button"
              type="button"
            >
              返回首页
            </button>
          </div>
        </div>
      </div>

      <div
        class="panorama-toolbar hidden"
        id="toolbar"
        aria-label="全景控制工具栏"
      >
        <button
          class="panorama-toolbar__button"
          id="home-button"
          type="button"
          title="返回首页"
          aria-label="返回首页"
        ></button>
        <button
          class="panorama-toolbar__button hidden"
          id="fisheye-button"
          type="button"
          title="切换镜头模式"
          aria-label="切换镜头模式"
        ></button>
        <button
          class="panorama-toolbar__button hidden"
          id="gyroscope-button"
          type="button"
          title="动态体感视角"
          aria-label="动态体感视角"
        ></button>
        <button
          class="panorama-toolbar__button hidden"
          id="vr-button"
          type="button"
          title="VR模式"
          aria-label="VR模式"
        ></button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
